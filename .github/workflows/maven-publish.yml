```yaml
name: Java CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build + run JUnit tests
      - name: Maven Build & Test
        run: |
          mvn -B clean verify

      # 4. Upload JUnit test results
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      # 5. Upload application JAR
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/*.jar
```
