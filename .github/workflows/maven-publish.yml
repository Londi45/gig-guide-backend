name: Java CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify -e

      - name: Show Surefire reports
        if: always()
        run: |
          echo "===== SUREFIRE REPORT FILES ====="
          find target/surefire-reports -type f -print || true

          echo "===== SUREFIRE TXT REPORTS ====="
          for file in target/surefire-reports/*.txt; do
            echo "===== $file ====="
            cat "$file"
          done

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
