name: Java CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gig_guide_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B -e clean verify -Dsurefire.useFile=false "-Djwt.secret=${JWT_SECRET}"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gig_guide_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_MAIL_USERNAME: ci@example.com
          SPRING_MAIL_PASSWORD: unused
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_ADMIN_FAIL_FAST: "false"
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests — already passed)
        run: mvn -B -DskipTests clean package -q

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: gilberttshamano
          password: dckr_pat_sk5JQ4OjwqQpbBxA4LuWvocDoZg

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gilberttshamano/gig-guide-backend:latest
            gilberttshamano/gig-guide-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -s "$RENDER_DEPLOY_HOOK"
