name: Java CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gig_guide_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          # NOTE: password is intentionally hardcoded — this is a throwaway CI container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B -e clean verify -Dsurefire.useFile=false
        env:
          # Database — matches what application-test.properties expects
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gig_guide_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          # Redis
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # JWT
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Mail — use dummy values in CI; email sending is not tested
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_MAIL_USERNAME: ci@example.com
          SPRING_MAIL_PASSWORD: unused
          # Kafka — disable listeners and point producer nowhere
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_ADMIN_FAIL_FAST: "false"
          # Kafka topic config
          APP_KAFKA_TOPIC_CLUB_CREATED: club-created
          APP_KAFKA_RETRY_FIXED_RATE_MS: "7200000"
          # Active profile
          SPRING_PROFILES_ACTIVE: test

      - name: List test reports
        if: always()
        run: |
          echo "===== SUREFIRE REPORTS ====="
          find target/surefire-reports -type f -print || true
          echo "===== DUMP FILES ====="
          find target/surefire-reports -name "*.dump" -exec cat {} \; || true
          echo "===== GIGGUIDE APP TEST ====="
          cat target/surefire-reports/com.Gig.Guide.GigGuide.GigGuideApplicationTests.txt || true
          echo "===== CLUB INTEGRATION TEST ====="
          cat "target/surefire-reports/com.Gig.Guide.GigGuide.Controllers.ClubControllerIntegrationTest.txt" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: warn
