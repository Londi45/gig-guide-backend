version: '3.8'

services:

  # ─── Zookeeper ──────────────────────────────────────────────────────────────
  # Kafka uses Zookeeper to manage broker metadata and leader election.
  # (Kafka 3.x can run without it using KRaft mode, but this setup is simpler)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: gig-guide-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ─── Kafka Broker ───────────────────────────────────────────────────────────
  # The actual message broker. Your Spring app connects to port 9092.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: gig-guide-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST is what your local app connects to (port 9092)
      # PLAINTEXT is for internal Docker network communication
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ─── Kafka UI (optional but very helpful) ───────────────────────────────────
  # Visual dashboard to browse topics, messages, consumer groups.
  # Visit http://localhost:8090 after starting
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: gig-guide-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
