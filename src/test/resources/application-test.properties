# ─── Test profile ────────────────────────────────────────────────────────────
# Used by both local integration tests and CI.
#
# In CI, environment variables override Spring Boot properties automatically
# via relaxed binding:
#   SPRING_DATASOURCE_URL        -> spring.datasource.url
#   SPRING_DATASOURCE_USERNAME   -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD   -> spring.datasource.password
#   SPRING_DATA_REDIS_HOST       -> spring.data.redis.host
#   SPRING_DATA_REDIS_PORT       -> spring.data.redis.port
#   JWT_SECRET                   -> jwt.secret
#
# These fallback values are used for local development only.

# Database — local fallback (CI overrides via env vars above)
spring.datasource.url=jdbc:postgresql://localhost:5432/gig_guide_db
spring.datasource.username=postgres
spring.datasource.password=@Londi45

# Redis — local fallback
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT — local fallback (CI overrides via JWT_SECRET env var)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1jaS1hbmQtbG9jYWwtdGVzdHMtb25seS0yNTY=
jwt.expiration=3600000

# Kafka — disable entirely for tests (no broker needed)
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=false

# Kafka topic names — required by beans even when Kafka is disabled
app.kafka.topic.club-created=club-created
app.kafka.retry.fixed-rate-ms=7200000

# Disable Hibernate schema validation in tests — avoids Flyway/entity column name mismatches
spring.jpa.hibernate.ddl-auto=none
spring.flyway.validate-on-migrate=false
logging.level.org.apache.kafka=ERROR
logging.level.io.lettuce=ERROR
logging.level.org.springframework.data.redis=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
