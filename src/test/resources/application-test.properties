# ─── Test profile ────────────────────────────────────────────────────────────
# Used by both local integration tests and CI.
#
# In CI, the following env vars override these values automatically:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT
#
# Locally, ensure PostgreSQL is running on localhost:5432 and Redis on localhost:6379.

# Disable Kafka listeners so a broker is not required to run tests
spring.kafka.listener.auto-startup=false
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=localhost:9092

# Local fallback DB config — overridden by SPRING_DATASOURCE_* env vars in CI
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD locally
# to avoid committing real credentials here
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gig_guide_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# Suppress noisy logs during test runs
logging.level.org.apache.kafka=ERROR
logging.level.io.lettuce=ERROR
logging.level.org.springframework.data.redis=ERROR
logging.level.org.hibernate.SQL=ERROR

# JWT — fallback for local test runs (CI overrides via JWT_SECRET env var)
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1jaS1hbmQtbG9jYWwtdGVzdHMtb25seS0yNTY=}
jwt.expiration=3600000
