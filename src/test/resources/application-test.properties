# ─── Test profile ────────────────────────────────────────────────────────────
# Used by both local integration tests and CI.
#
# In CI, the following env vars override these values automatically:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT
#
# Locally, ensure PostgreSQL is running on localhost:5432 and Redis on localhost:6379.

# Disable Kafka listeners so a broker is not required to run tests
spring.kafka.listener.auto-startup=false
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=localhost:9092

# Local fallback DB config — overridden by env vars in CI
spring.datasource.url=jdbc:postgresql://localhost:5432/gig_guide_db
spring.datasource.username=postgres
spring.datasource.password=@Londi45

# Suppress noisy logs during test runs
logging.level.org.apache.kafka=ERROR
logging.level.io.lettuce=ERROR
logging.level.org.springframework.data.redis=ERROR
logging.level.org.hibernate.SQL=ERROR
