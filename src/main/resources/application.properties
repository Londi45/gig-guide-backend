spring.data.redis.host=localhost
spring.data.redis.port=6379
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG



# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/
app.base-url=http://localhost:8080

spring.kafka.bootstrap-servers=localhost:9092

# Producer: serialize messages as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Fail fast if Kafka is unreachable — don't block the HTTP thread
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.retries=0

# Consumer: deserialize JSON back to a Java object
spring.kafka.consumer.group-id=gig-guide-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Stop flooding logs  back off before each reconnect attempt
spring.kafka.consumer.properties.reconnect.backoff.ms=2000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=30000
spring.kafka.consumer.properties.retry.backoff.ms=2000
# Tell the JsonDeserializer which packages are trusted (prevents security exceptions)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.Gig.Guide.GigGuide.Kafka.events

# Topic name constant  used by producer and consumer
app.kafka.topic.club-created=club-created

# How often to run the retry job (every 2 hours)
app.kafka.retry.fixed-rate-ms=7200000


logging.level.org.apache.kafka.clients.NetworkClient=ERROR


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Cache health checks for 10 seconds to avoid hammering Kafka with probes
management.endpoint.health.cache.time-to-live=10s
